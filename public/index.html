<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Pricing System</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <h1>Inventory Pricing System</h1>
  <div class="sub">Node.js + Google Sheets</div>

  <div class="stats">
    <div class="stat"><b id="sItems">0</b><span>Products</span></div>
    <div class="stat"><b id="sUnits">0</b><span>Units in stock</span></div>
    <div class="stat"><b id="sCost">0</b><span>Stock value (cost)</span></div>
    <div class="stat"><b id="sRetail">0</b><span>Stock value (retail)</span></div>
  </div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search name, SKU or category…" aria-label="Search">
    <select id="cat" aria-label="Category filter"><option value="">All categories</option></select>
    <button class="p" id="add">+ Add product</button>
  </div>

  <div class="panel">
    <table>
      <thead><tr>
        <th data-k="sku">SKU</th><th data-k="name">Product</th><th data-k="category">Category</th>
        <th class="n" data-k="qty">Qty</th><th class="n" data-k="cost">Cost</th>
        <th class="n" data-k="price">Price</th><th class="n" data-k="margin">Margin</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">Loading from Google Sheets…</div>
  </div>
  <div class="note">Click a column heading to sort.</div>
</div>

<dialog id="dlg">
  <form method="dialog" id="f" novalidate>
    <h2 id="dt">Add product</h2>
    <label for="fSku">SKU</label><input id="fSku" required maxlength="40">
    <label for="fName">Product name</label><input id="fName" required maxlength="100">
    <label for="fCat">Category</label><input id="fCat" maxlength="40" list="cats">
    <datalist id="cats"></datalist>
    <div class="row">
      <div><label for="fQty">Quantity</label><input id="fQty" type="number" min="0" step="1" value="0"></div>
      <div><label for="fCost">Cost price</label><input id="fCost" type="number" min="0" step="0.01" value="0"></div>
    </div>
    <label for="fPrice">Selling price</label><input id="fPrice" type="number" min="0" step="0.01" value="0">
    <div class="err" id="err"></div>
    <div class="foot"><button type="button" id="cancel">Cancel</button><button type="submit" class="p" id="save">Save</button></div>
  </form>
</dialog>

<dialog id="dlgDel">
  <h2>Delete product?</h2>
  <div id="delTxt" class="mut"></div>
  <div class="foot"><button id="delNo">Cancel</button><button class="d" id="delYes">Delete</button></div>
</dialog>

<script src="assets/app.js"></script>
</body>
</html>
